# scout_v2_control.yaml  (ROS 2 / gz_ros2_control)
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    # declare controllers aqui (nome → tipo)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    skid_drive_controller:
      type: diff_drive_controller/DiffDriveController

skid_drive_controller:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel
      - rear_left_wheel

    right_wheel_names:
      - front_right_wheel
      - rear_right_wheel

    wheel_radius: 0.165            # RAIO REAL DA COLLISION
    wheel_separation: 0.585         # DISTÂNCIA ENTRE LADOS (Y)

    publish_rate: 50.0

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false
    use_stamped_vel: false

    # MUITO IMPORTANTE PARA SKID
    open_loop: true

    # SUAVIZA COMANDOS (reduz drift)
    accel_limit: 0.25
    decel_limit: 0.25

    cmd_vel_timeout: 0.5

# Parâmetros de cada controlador
joint_state_broadcaster:
  ros__parameters: {}

